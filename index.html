<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css" />
		<link rel="stylesheet" href="dist/reveal.css" />
		<link rel="stylesheet" href="dist/theme/black.css" />

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
    <link rel="stylesheet" href="dist/reset.css" />
    <link rel="stylesheet" href="dist/reveal.css" />
    <link rel="stylesheet" href="dist/theme/white.css" />
    <link rel="stylesheet" href="vendor/highlight.js/styles/xcode.css" />
    <link rel="stylesheet" href="vendor/fonts/poppins/poppins.css" />
    <style>
      :root {
        --r-heading-font: 'Poppins', sans-serif;
        --r-heading-text-transform: none;
      }
      #slide-footer {
        position: fixed;
        bottom: 0.75em;
        left: 0.75em;
        font-family: var(--r-heading-font);
        font-size: 1.2em;
        color: #555;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="slide-footer">Tim Schilling • www.better-simple.com</div>
		<div class="reveal">
			<div class="slides">
				<section data-markdown>
					<textarea data-template>
						# ✋ How can I contribute to Django? 💚

						Note:
						Who here thinks contributing to open source could help them improve their skills?
						Who here thinks contributing to open source could help them grow their network?
						Who here thinks open source contributions are useful indicator when hiring?
						Who here wants to contribute to open source?
						---
						# I want to convince you to contribute

						Note:
						My goal for the remaining four minutes is to convince you to make a self-commitment to contribute to open source. Let's see if I can do it.
						---
						# First, your skills are desired
						- Software engineers
						- Dev Ops
						- Front-end
						- Designers
						- Technical writers
						- Fundraisers
						- Testers
						- Translators
						- Product owners
						- Data scientists
						- SEO optimizers
						- Marketing
						- Organizers
						- Entry level devs
						- Senior engineers
						- Staff engineers
						- CTOs

						Note:
						First. Your skills are desired. We need:
						- *click* Software engineers
						- *click* Dev Ops people
						- *click* Front-end folks
						- *click* Designers
						- *click* Technical writers
						- *click* Fundraisers
						- *click* Testers
						- *click* Translators
						- *click* Product owners
						- *click* Data scientists
						- *click* SEO optimizers
						- *click* Marketing
						- *click* Organizers.
						- But it's more than just skills, it's experience levels too. *click* We want entry level devs
						- *click* Senior engineers
						- *click* Staff engineers
						- *click* CTOs

						Basically, if you're in this room, you have something to contribute to Django. I promise you do.
						---
						# Second, hiring is about who you know
						Open source provides you a network outside your day job

						Note:
						Second, hiring is about who you know. And there's going to come a time when you are looking for a new job.
						Having a network of people that you can reach out to who aren't tied to your job is extremely helpful.
						It's also really nice to have a network who aren't in the same field as you. Maybe you want to jump to a new business domain or tech stack. That's easier when you know people in that area.
						---
						# Third, it's a public record of your ability
						Your resume is a lot more appealing when there's evidence attached to it

						Note:
						Third, and lastly. It's a public record of your ability. A lot of your work is likely closed-source and behind an NDA.
						Open source work, is something that you can publicly share that displays what you know and what you're capable of.
						I don't know about you, but if there's something I can do to avoid a whiteboard exercise, I'm going to do it.
						---
						# Where can I start this week?

						Note:
						Since I'm running short on time, I'm going to skip the part where I ask how many of you want to contribute now.
						It's probably safe to assume it's all of you.
						The next logical question is, where can I start?
						---
						# Sprints
						Visit https://2026.djangocon.us/sprints/ and `#sprints` on Slack

						Note:
						Good news! We have sprints this thursday and friday. Sprints are collaboration events where people work together on
						open-source for a full day. You'll have the opportunity to contribute to number of projects, including Django.
						On thursday morning we'll have presentations on how to contribute to Django and how to do a code review for Django.
						In the afternoon, we're going to have a review session of the new features board for Django.
						If you've got questions or want to get started early, check out the #sprints channel.
						---
						# Djangonaut Space
						Accepting applications now! https://djangonaut.space

						Note:
						If you're not going to be at sprints or would like a little more assistance getting started.
						Djangonaut Space is a 8 week contributor mentorship program. It's full of space puns and super welcoming people.
						We'll match you with community mentors who will guide and support you as you learn to contribute to an open source project like Django.
						We expect people to spend about 5 hours a week during this program and we're currently accepting applications.
						This next session launches October 12th
						---
						# Chat with the DSF booth

						Note:
						If you're not interested in code or documentation contributions and are more focused on the community and marketing aspects, stop by the DSF booth and ask how you can get involved.
						Someone from the board or steering council should be around to answer questions and help you find your path to contributing back.
						---
						# Find Tim Schilling
						Ping me on Slack (Tim Schilling), Discord (CodenameTim), Email (schillingt@better-simple.com)

						Note:
						And if all those fail, come find me. I'm happy to help. You can find me on Slack as Tim Schilling, Discord as CodenameTim or email me.
						---
						# About me
						- 6.x Steering Council member (steers Django's technical direction)
						- Djangonaut Space admin (contributor mentorship program)
						- Django Commons admin (community-owned 3rd-party packages)
						- Django Debug Toolbar maintainer

						Note:
						Which reminds me, I didn't introduce myself. Hi, My name is Tim. I'm an avid Django community contributor.
						I'm on the Steering Council which, umm, steers Django's technical direction.
						I'm a Djangonaut Space admin which is the contributor mentorship program for Django.
						I'm a Django Commons admin which is an org that supports community-maintained packages.
						I'm also one of the maintainers for the Django Debug Toolbar library.
						---
						# I'll see you on the internet!

						Note:
						I truly hope you choose to contribute to Django, not just because we need your help, but because I believe it's good for you.
						And with that, thank you and I'll see you on the internet!
					</textarea>
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="dist/plugin/notes.js"></script>
		<script src="dist/plugin/markdown.js"></script>
		<script src="dist/plugin/highlight.js"></script>
		<script>
	      Reveal.initialize({
        hash: true,
        width: 1440,
        height: 753,
        margin: 0.04,
        center: false,
				maxScale: 4.0,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      });
		</script>
	</body>
</html>
